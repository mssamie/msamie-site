<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Published vesicle morphogenesis pathway</title>
  <desc id="desc">A schematic showing an interconnected aggregate network, a cylindrical micelle cage, a lamellar cage, and a closed vesicle formed by amphiphilic BAB triblock copolymers in water.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4fb"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563a6"/>
      <stop offset="1" stop-color="#60a5d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#16324f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f7184"/>
    </marker>
    <pattern id="water-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="2.5" fill="#86c5e8" opacity=".34"/>
      <circle cx="22" cy="19" r="2" fill="#86c5e8" opacity=".23"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <rect x="36" y="36" width="1528" height="828" rx="28" fill="url(#water-dots)" stroke="#d9e6f2" stroke-width="2"/>

  <text x="800" y="102" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#17324d">
    Published vesicle morphogenesis pathway
  </text>
  <text x="800" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" fill="#516579">
    Amphiphilic BAB triblock copolymers in aqueous solution
  </text>

  <g filter="url(#shadow)">
    <rect x="82" y="205" width="320" height="515" rx="24" fill="#ffffff" stroke="#d7e3ed" stroke-width="2"/>
    <rect x="454" y="205" width="320" height="515" rx="24" fill="#ffffff" stroke="#d7e3ed" stroke-width="2"/>
    <rect x="826" y="205" width="320" height="515" rx="24" fill="#ffffff" stroke="#d7e3ed" stroke-width="2"/>
    <rect x="1198" y="205" width="320" height="515" rx="24" fill="#ffffff" stroke="#d7e3ed" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#5f7184" stroke-width="5" marker-end="url(#arrow)">
    <path d="M 408 455 H 442"/>
    <path d="M 780 455 H 814"/>
    <path d="M 1152 455 H 1186"/>
  </g>

  <!-- Stage 1: interconnected aggregate network -->
  <g transform="translate(98 255)">
    <g fill="none" stroke="#cf4d57" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 135 C78 62 125 78 152 125 S230 203 272 122"/>
      <path d="M44 255 C96 185 132 210 156 254 S225 314 272 245"/>
      <path d="M82 92 C118 134 90 181 130 215 S215 230 240 276"/>
      <path d="M72 302 C92 268 110 241 136 215"/>
    </g>
    <g fill="#2f75b5">
      <circle cx="36" cy="135" r="15"/><circle cx="60" cy="98" r="14"/><circle cx="96" cy="80" r="14"/>
      <circle cx="151" cy="124" r="15"/><circle cx="188" cy="171" r="14"/><circle cx="232" cy="178" r="14"/><circle cx="273" cy="122" r="15"/>
      <circle cx="43" cy="255" r="15"/><circle cx="79" cy="220" r="14"/><circle cx="118" cy="220" r="14"/>
      <circle cx="157" cy="255" r="15"/><circle cx="196" cy="292" r="14"/><circle cx="239" cy="281" r="14"/><circle cx="273" cy="245" r="15"/>
      <circle cx="82" cy="92" r="15"/><circle cx="101" cy="158" r="14"/><circle cx="132" cy="215" r="15"/>
      <circle cx="189" cy="224" r="14"/><circle cx="240" cy="276" r="15"/><circle cx="72" cy="302" r="15"/>
    </g>
    <g fill="#e67b82" opacity=".95">
      <circle cx="76" cy="128" r="9"/><circle cx="115" cy="112" r="9"/><circle cx="172" cy="151" r="9"/>
      <circle cx="218" cy="187" r="9"/><circle cx="86" cy="241" r="9"/><circle cx="132" cy="239" r="9"/>
      <circle cx="180" cy="278" r="9"/><circle cx="225" cy="286" r="9"/><circle cx="105" cy="188" r="9"/>
      <circle cx="157" cy="224" r="9"/><circle cx="212" cy="247" r="9"/>
    </g>
  </g>

  <!-- Stage 2: cylindrical micelle cage -->
  <g transform="translate(483 257)">
    <ellipse cx="130" cy="172" rx="105" ry="122" fill="#eaf4fb" stroke="#2f75b5" stroke-width="16"/>
    <ellipse cx="130" cy="172" rx="70" ry="88" fill="#fff" stroke="#cf4d57" stroke-width="18" stroke-dasharray="54 19"/>
    <path d="M55 82 C86 126 89 219 53 263" fill="none" stroke="#2f75b5" stroke-width="20" stroke-linecap="round"/>
    <path d="M205 82 C174 126 171 219 207 263" fill="none" stroke="#2f75b5" stroke-width="20" stroke-linecap="round"/>
    <path d="M72 59 C110 91 151 91 190 59" fill="none" stroke="#cf4d57" stroke-width="18" stroke-linecap="round"/>
    <path d="M72 285 C110 253 151 253 190 285" fill="none" stroke="#cf4d57" stroke-width="18" stroke-linecap="round"/>
    <g fill="#2f75b5">
      <circle cx="39" cy="124" r="12"/><circle cx="31" cy="173" r="12"/><circle cx="40" cy="221" r="12"/>
      <circle cx="221" cy="124" r="12"/><circle cx="229" cy="173" r="12"/><circle cx="220" cy="221" r="12"/>
      <circle cx="96" cy="44" r="12"/><circle cx="130" cy="36" r="12"/><circle cx="165" cy="44" r="12"/>
      <circle cx="96" cy="300" r="12"/><circle cx="130" cy="308" r="12"/><circle cx="165" cy="300" r="12"/>
    </g>
  </g>

  <!-- Stage 3: lamellar cage -->
  <g transform="translate(847 248)">
    <path d="M58 280 A116 116 0 1 1 231 257" fill="none" stroke="#2f75b5" stroke-width="24" stroke-linecap="round"/>
    <path d="M77 264 A91 91 0 1 1 214 247" fill="none" stroke="#cf4d57" stroke-width="27" stroke-linecap="round"/>
    <path d="M97 247 A65 65 0 1 1 196 230" fill="none" stroke="#2f75b5" stroke-width="22" stroke-linecap="round"/>
    <path d="M58 280 L91 246" stroke="#6da7cf" stroke-width="10" stroke-linecap="round"/>
    <path d="M231 257 L196 230" stroke="#6da7cf" stroke-width="10" stroke-linecap="round"/>
    <circle cx="146" cy="172" r="54" fill="url(#water-dots)" stroke="#d9e6f2" stroke-width="2"/>
  </g>

  <!-- Stage 4: closed vesicle -->
  <g transform="translate(1226 248)">
    <circle cx="132" cy="172" r="126" fill="#dff1fb" stroke="url(#shell)" stroke-width="24"/>
    <circle cx="132" cy="172" r="99" fill="none" stroke="#cf4d57" stroke-width="30"/>
    <circle cx="132" cy="172" r="73" fill="url(#water-dots)" stroke="#2f75b5" stroke-width="20"/>
    <g fill="#2f75b5">
      <circle cx="132" cy="35" r="10"/><circle cx="200" cy="56" r="10"/><circle cx="246" cy="112" r="10"/>
      <circle cx="266" cy="176" r="10"/><circle cx="241" cy="242" r="10"/><circle cx="194" cy="289" r="10"/>
      <circle cx="132" cy="309" r="10"/><circle cx="68" cy="290" r="10"/><circle cx="20" cy="242" r="10"/>
      <circle cx="-2" cy="176" r="10"/><circle cx="19" cy="111" r="10"/><circle cx="66" cy="57" r="10"/>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="242" y="665" font-size="25" font-weight="700" fill="#17324d">Interconnected network</text>
    <text x="614" y="665" font-size="25" font-weight="700" fill="#17324d">Cylindrical micelle cage</text>
    <text x="986" y="665" font-size="25" font-weight="700" fill="#17324d">Lamellar cage</text>
    <text x="1358" y="665" font-size="25" font-weight="700" fill="#17324d">Closed vesicle</text>
  </g>

  <g transform="translate(468 774)" font-family="Inter, Arial, sans-serif" font-size="21" fill="#42566a">
    <circle cx="0" cy="0" r="11" fill="#2f75b5"/>
    <text x="22" y="7">Hydrophilic A block</text>
    <circle cx="286" cy="0" r="11" fill="#cf4d57"/>
    <text x="308" y="7">Hydrophobic B block</text>
    <circle cx="600" cy="0" r="6" fill="#86c5e8" opacity=".7"/>
    <text x="619" y="7">Water</text>
  </g>
  <text x="800" y="835" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#687b8e">
    Original schematic based on Liu, Samie, and Sureshkumar, Colloids and Interfaces 8 (2024) 29.
  </text>
</svg>
