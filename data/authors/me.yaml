bio: |
  I am a PhD candidate in Biomedical and Chemical Engineering at Syracuse University,
  advised by Prof. Radhakrishna Sureshkumar and co-advised by Prof. James Henderson.
  My research uses coarse-grained molecular dynamics to study polymer and surfactant
  self-assembly, with a focus on amphiphilic copolymer systems, micelles, vesicles,
  and the molecular mechanisms that drive morphology evolution.

